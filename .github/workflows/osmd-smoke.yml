name: OSMD browser smoke

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  real-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          # Release patch is derived from first-parent history since v3.0.0.
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Install test-only Playwright client without modifying app dependencies
        run: |
          # Installing with npm --no-save in the repository can prune Rollup's
          # optional native binary, breaking vite preview after a successful build.
          # Keep the browser test client in a separate dependency tree.
          npm install --prefix "$RUNNER_TEMP/notare-playwright" --no-save --no-package-lock --ignore-scripts playwright@1.64.1
          ln -s "$RUNNER_TEMP/notare-playwright/node_modules/playwright" node_modules/playwright
          node -e "import('playwright').then(() => console.log('Playwright client resolved'))"
      - uses: browser-actions/setup-chrome@v2
        id: chrome
      - name: Start production preview server
        run: |
          npm run preview -- --host 127.0.0.1 --port 4173 > /tmp/notare-preview.log 2>&1 &
          for i in {1..40}; do
            if curl --silent --fail http://127.0.0.1:4173/ > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/notare-preview.log
          exit 1
      - name: Verify lesson-one pitch certification and standalone speed test
        env:
          CHROME_PATH: ${{ steps.chrome.outputs.chrome-path }}
        run: node tests/lesson-one-credit.smoke.mjs
      - name: Verify lesson-2 rolling accuracy and v1 historic migration
        env:
          CHROME_PATH: ${{ steps.chrome.outputs.chrome-path }}
        run: node tests/lesson-two-rolling.smoke.mjs
      - name: Verify course-window reset, persistence and lifetime credit safety
        env:
          CHROME_PATH: ${{ steps.chrome.outputs.chrome-path }}
        run: node tests/course-window-reset-uat.smoke.mjs
      - name: Verify result card, exact retry, assisted exclusion and lifecycle
        env:
          CHROME_PATH: ${{ steps.chrome.outputs.chrome-path }}
        run: node tests/trainer-results.smoke.mjs
      - name: Preplay checklist, four-beat count-in and cancellation
        env:
          CHROME_PATH: ${{ steps.chrome.outputs.chrome-path }}
        run: node tests/preplay-countin.smoke.mjs
      - name: Verify score-first count-in when starting certified lesson 3 from Course or Studio
        env:
          CHROME_PATH: ${{ steps.chrome.outputs.chrome-path }}
        run: node tests/graded-flow-countin.smoke.mjs
      - name: Verify compact Studio preplay and score-renderer controls
        env:
          CHROME_PATH: ${{ steps.chrome.outputs.chrome-path }}
        run: node tests/studio-compact-layout.smoke.mjs
      - name: Verify 320/375/768px lesson title and readable OSMD overlays
        env:
          CHROME_PATH: ${{ steps.chrome.outputs.chrome-path }}
        run: node tests/mobile-score-readability.smoke.mjs
      - name: Verify four-group Studio toolbar and MIDI-aware keyboard
        env:
          CHROME_PATH: ${{ steps.chrome.outputs.chrome-path }}
        run: node tests/compact-toolbar.smoke.mjs
      - name: Verify persistent light and dark themes in Chrome
        env:
          CHROME_PATH: ${{ steps.chrome.outputs.chrome-path }}
        run: node tests/theme.smoke.mjs
      - name: Verify local MusicXML/MXL repertoire preview without graded input
        env:
          CHROME_PATH: ${{ steps.chrome.outputs.chrome-path }}
        run: node tests/repertoire.smoke.mjs
      - name: Verify gated MIDI pitch-by-pitch practice without certification
        env:
          CHROME_PATH: ${{ steps.chrome.outputs.chrome-path }}
        run: node tests/repertoire-pitch-trial.smoke.mjs
      - name: Verify ungraded polyphonic score practice and accompanying hand
        env:
          CHROME_PATH: ${{ steps.chrome.outputs.chrome-path }}
        run: node tests/repertoire-polyphonic.smoke.mjs
      - name: Verify private adaptive Reflex without changing course grades
        env:
          CHROME_PATH: ${{ steps.chrome.outputs.chrome-path }}
        run: node tests/adaptive-reflex.smoke.mjs
      - name: Verify ungraded major/minor triad inversions with physical MIDI
        env:
          CHROME_PATH: ${{ steps.chrome.outputs.chrome-path }}
        run: node tests/chordStudy.smoke.mjs
      - name: Verify versioned Module V V1 guide, MIDI evidence and legacy isolation
        env:
          CHROME_PATH: ${{ steps.chrome.outputs.chrome-path }}
        run: node tests/moduleVGuided.smoke.mjs
      - name: Verify Module V V2 OSMD inversion reading, answer privacy and persistence
        env:
          CHROME_PATH: ${{ steps.chrome.outputs.chrome-path }}
        run: node tests/moduleVInversions.smoke.mjs
      - name: Verify independent LH accompaniments in 4/4 and genuine 3/4
        env:
          CHROME_PATH: ${{ steps.chrome.outputs.chrome-path }}
        run: node tests/accompanimentStudy.smoke.mjs
      - name: Verify harmonic-minor V-i in all four keys with OSMD and physical MIDI
        env:
          CHROME_PATH: ${{ steps.chrome.outputs.chrome-path }}
        run: node tests/harmonicMinor.smoke.mjs
      - name: Verify Zen score space, audio, MIDI and photo safety in Chrome
        env:
          CHROME_PATH: ${{ steps.chrome.outputs.chrome-path }}
        run: node tests/zen-mode.smoke.mjs
      - name: Verify focused graded course controls, MusicXML and explicit ungraded setup
        env:
          CHROME_PATH: ${{ steps.chrome.outputs.chrome-path }}
        run: node tests/course-focus.smoke.mjs
      - name: Verify compact Course toolbar, module filters and always-accessible lesson launch
        env:
          CHROME_PATH: ${{ steps.chrome.outputs.chrome-path }}
        run: node tests/course-compact.smoke.mjs
      - name: Verify three destinations, Course continuation and embedded Studio tools
        env:
          CHROME_PATH: ${{ steps.chrome.outputs.chrome-path }}
        run: node tests/studio-navigation.smoke.mjs
      - name: Verify lesson-three live rhythm onset accuracy and missed-note counters
        env:
          CHROME_PATH: ${{ steps.chrome.outputs.chrome-path }}
        run: node tests/lesson-three-rhythm.smoke.mjs
      - name: Verify distinct wrong/missed feedback against live rhythmic flow
        env:
          CHROME_PATH: ${{ steps.chrome.outputs.chrome-path }}
        run: node tests/stage-f-feedback.smoke.mjs
      - name: Capture six-breakpoint stave and Zen visual-review matrix
        env:
          CHROME_PATH: ${{ steps.chrome.outputs.chrome-path }}
        run: node tests/stage-f-visual.smoke.mjs
      - name: Exercise OSMD with real browser
        env:
          CHROME_PATH: ${{ steps.chrome.outputs.chrome-path }}
        run: node tests/osmd.smoke.mjs
      - name: Verify SoundFont bank and user import in Chrome
        env:
          CHROME_PATH: ${{ steps.chrome.outputs.chrome-path }}
        run: node tests/soundfont.smoke.mjs
      - name: Verify MIDI held notes and sustain in Chrome
        env:
          CHROME_PATH: ${{ steps.chrome.outputs.chrome-path }}
        run: node tests/midi.smoke.mjs
      - name: Stress-test MIDI polyphony, pedal and dispatch metrics
        env:
          CHROME_PATH: ${{ steps.chrome.outputs.chrome-path }}
        run: node tests/midi-stress.smoke.mjs
      - name: Verify F-major physical MIDI versus enharmonic Bb notation
        env:
          CHROME_PATH: ${{ steps.chrome.outputs.chrome-path }}
        run: node tests/enharmonicScoring.smoke.mjs
      - name: Verify optional lessons 11 and 12 two-hand MIDI trials remain ungraded
        env:
          CHROME_PATH: ${{ steps.chrome.outputs.chrome-path }}
        run: node tests/courseTwoHandTrial.smoke.mjs
      - name: Verify hardware self-check and no accidental lesson scoring
        env:
          CHROME_PATH: ${{ steps.chrome.outputs.chrome-path }}
        run: node tests/hardware-uat.smoke.mjs
      - name: Verify assisted steps never count for certification
        env:
          CHROME_PATH: ${{ steps.chrome.outputs.chrome-path }}
        run: node tests/assisted.smoke.mjs
      - name: Verify course flow timing and grading in Chrome
        env:
          CHROME_PATH: ${{ steps.chrome.outputs.chrome-path }}
        run: node tests/flow.smoke.mjs
      - name: Verify AudioContext-clock preview timestamps and cancellation
        env:
          CHROME_PATH: ${{ steps.chrome.outputs.chrome-path }}
        run: node tests/audio-timeline.smoke.mjs
      - name: Verify trainer preferences persist, reset and reject invalid storage
        env:
          CHROME_PATH: ${{ steps.chrome.outputs.chrome-path }}
        run: node tests/preferences.smoke.mjs
      - name: Check responsive layout and keyboard-accessible Settings
        env:
          CHROME_PATH: ${{ steps.chrome.outputs.chrome-path }}
        run: node tests/responsive-a11y.smoke.mjs
      - name: Verify exact build version and commit in Chrome
        env:
          CHROME_PATH: ${{ steps.chrome.outputs.chrome-path }}
        run: node tests/release-version.smoke.mjs
      - name: Verify technical status bar, renderer persistence and modal isolation
        env:
          CHROME_PATH: ${{ steps.chrome.outputs.chrome-path }}
        run: node tests/status-bar.smoke.mjs
      - name: Check five-workspace responsive and keyboard navigation
        env:
          CHROME_PATH: ${{ steps.chrome.outputs.chrome-path }}
        run: node tests/workspaces-a11y.smoke.mjs
      - name: Prevent photo-memory hint leaks and preserve native keyboard controls
        env:
          CHROME_PATH: ${{ steps.chrome.outputs.chrome-path }}
        run: node tests/photo-shortcuts.smoke.mjs
      - name: Measure real OSMD loading and production bundle sizes
        env:
          CHROME_PATH: ${{ steps.chrome.outputs.chrome-path }}
        run: node tests/performance-baseline.smoke.mjs
      - name: Upload browser diagnostics and screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: osmd-browser-diagnostics
          path: |
            artifacts/*.png
            artifacts/performance-baseline.json
            artifacts/stage-f-stave-metrics.json
          if-no-files-found: ignore
