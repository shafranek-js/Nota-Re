name: OSMD browser smoke

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  real-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Install test-only Playwright client
        run: npm install --no-save --no-package-lock --ignore-scripts playwright@1.64.1
      - uses: browser-actions/setup-chrome@v2
        id: chrome
      - name: Start production preview server
        run: |
          npm run preview -- --host 127.0.0.1 --port 4173 > /tmp/notare-preview.log 2>&1 &
          for i in {1..40}; do
            if curl --silent --fail http://127.0.0.1:4173/ > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/notare-preview.log
          exit 1
      - name: Verify result card, exact retry, assisted exclusion and lifecycle
        env:
          CHROME_PATH: ${{ steps.chrome.outputs.chrome-path }}
        run: node tests/trainer-results.smoke.mjs
      - name: Exercise OSMD with real browser
        env:
          CHROME_PATH: ${{ steps.chrome.outputs.chrome-path }}
        run: node tests/osmd.smoke.mjs
      - name: Verify SoundFont bank and user import in Chrome
        env:
          CHROME_PATH: ${{ steps.chrome.outputs.chrome-path }}
        run: node tests/soundfont.smoke.mjs
      - name: Verify MIDI held notes and sustain in Chrome
        env:
          CHROME_PATH: ${{ steps.chrome.outputs.chrome-path }}
        run: node tests/midi.smoke.mjs
      - name: Stress-test MIDI polyphony, pedal and dispatch metrics
        env:
          CHROME_PATH: ${{ steps.chrome.outputs.chrome-path }}
        run: node tests/midi-stress.smoke.mjs
      - name: Verify hardware self-check and no accidental lesson scoring
        env:
          CHROME_PATH: ${{ steps.chrome.outputs.chrome-path }}
        run: node tests/hardware-uat.smoke.mjs
      - name: Verify assisted steps never count for certification
        env:
          CHROME_PATH: ${{ steps.chrome.outputs.chrome-path }}
        run: node tests/assisted.smoke.mjs
      - name: Verify course flow timing and grading in Chrome
        env:
          CHROME_PATH: ${{ steps.chrome.outputs.chrome-path }}
        run: node tests/flow.smoke.mjs
      - name: Verify AudioContext-clock preview timestamps and cancellation
        env:
          CHROME_PATH: ${{ steps.chrome.outputs.chrome-path }}
        run: node tests/audio-timeline.smoke.mjs
      - name: Verify trainer preferences persist, reset and reject invalid storage
        env:
          CHROME_PATH: ${{ steps.chrome.outputs.chrome-path }}
        run: node tests/preferences.smoke.mjs
      - name: Check responsive layout and keyboard-accessible Settings
        env:
          CHROME_PATH: ${{ steps.chrome.outputs.chrome-path }}
        run: node tests/responsive-a11y.smoke.mjs
      - name: Verify exact build version and commit in Chrome
        env:
          CHROME_PATH: ${{ steps.chrome.outputs.chrome-path }}
        run: node tests/release-version.smoke.mjs
      - name: Verify technical status bar, renderer persistence and modal isolation
        env:
          CHROME_PATH: ${{ steps.chrome.outputs.chrome-path }}
        run: node tests/status-bar.smoke.mjs
      - name: Check five-workspace responsive and keyboard navigation
        env:
          CHROME_PATH: ${{ steps.chrome.outputs.chrome-path }}
        run: node tests/workspaces-a11y.smoke.mjs
      - name: Prevent photo-memory hint leaks and preserve native keyboard controls
        env:
          CHROME_PATH: ${{ steps.chrome.outputs.chrome-path }}
        run: node tests/photo-shortcuts.smoke.mjs
      - name: Measure real OSMD loading and production bundle sizes
        env:
          CHROME_PATH: ${{ steps.chrome.outputs.chrome-path }}
        run: node tests/performance-baseline.smoke.mjs
      - name: Upload browser diagnostics and screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: osmd-browser-diagnostics
          path: |
            artifacts/*.png
            artifacts/performance-baseline.json
          if-no-files-found: ignore
