name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Validate GitHub Pages build and bundled audio assets
        env:
          NOTARE_PUBLIC_BASE: /Nota-Re/
        run: |
          npm run build
          node scripts/verify-pages-build.mjs
