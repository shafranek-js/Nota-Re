# Temporary dependency-lock migration helper, scoped to the OSMD feature branch.
# Removed once the canonical lockfile has been committed.
name: OSMD dependency lockfile migration

on:
  push:
    branches:
      - feat/osmd-score-viewer

permissions:
  contents: write

jobs:
  lockfile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Rebuild NPM dependency lockfile
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Commit resolved lockfile to same feature branch
        run: |
          git add package-lock.json
          if git diff --cached --quiet; then
            echo "package-lock.json already matches package.json"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore(lockfile): resolve OSMD 2.2.1 dependency graph"
          git push origin HEAD:feat/osmd-score-viewer
