name: Microphone R0E — local physical-device readiness

on:
  pull_request:
    paths:
      - '.github/workflows/microphone-local-device-lab.yml'
      - 'scripts/serve-local-microphone-lab.mjs'
      - 'scripts/local-microphone-lab.html'
      - 'scripts/local-microphone-lab.mjs'
      - 'scripts/local-microphone-report.mjs'
      - 'scripts/streaming-attack-tracker.mjs'
      - 'tests/localMicrophoneLab.test.mjs'
      - 'tests/local-microphone-lab.smoke.mjs'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  optional-microphone-consent-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Validate privacy-only report, matching invariants and asset allowlist
        run: node --experimental-strip-types --test tests/localMicrophoneLab.test.mjs tests/streamingAttackTracker.test.mjs
      - name: Install pinned research-only AudioWorklet detector and browser client
        run: npm install --no-save --package-lock=false @markusstrasser/pitchplease@3.1.0 playwright@1.64.1
      - uses: browser-actions/setup-chrome@v2
        id: chrome
      - name: Test real AudioWorklet with Chrome fake microphone and strict user consent
        env:
          CHROME_PATH: ${{ steps.chrome.outputs.chrome-path }}
        run: node tests/local-microphone-lab.smoke.mjs
      - name: Audit no microphone recordings are checked into the repository
        run: |
          if git ls-files '*.wav' '*.mp3' '*.m4a' '*.flac' | grep -E '^scripts/local-microphone|^tests/local-microphone'; then
            echo 'Research microphone audio must never be committed'
            exit 1
          fi
          echo 'No research microphone recordings committed'
