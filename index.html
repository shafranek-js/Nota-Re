<!DOCTYPE html>
<html lang="ru" class="dark">
  <head>
    <script>
      // Apply the stored appearance before styles and React to avoid a dark flash.
      try {
        const light = localStorage.getItem('notare-theme-v1') === 'light';
        document.documentElement.dataset.theme = light ? 'light' : 'dark';
        document.documentElement.classList.toggle('dark', !light);
      } catch {
        document.documentElement.dataset.theme = 'dark';
      }
    </script>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>NotaRe Academy & Studio — Интерактивный курс и тренажёр чтения с листа</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;600;700&display=swap" rel="stylesheet">
  </head>
  <body class="h-screen w-screen overflow-hidden bg-[#060a12] text-slate-100 font-sans select-none">
    <div id="root" class="h-full w-full"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
